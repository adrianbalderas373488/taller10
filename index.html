<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi panel</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header>
    <h1>Mi panel</h1>
  </header>

  <main>
    <!-- Vista 1: login -->
    <section id="login-section" hidden>
      <h2>Iniciar sesión</h2>
      <form id="login-form">
        <label for="username">Usuario</label>
        <input id="username" name="username" type="text" autocomplete="username" required>

        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <button id="login-button" type="submit">Entrar</button>
        <p id="login-error" role="alert" hidden></p>
      </form>
    </section>

    <!-- Vista 2: panel -->
    <section id="panel-section" hidden>
      <button id="logout-button" type="button">Cerrar sesión</button>

      <section id="profile-section">
        <h2>Mi perfil</h2>
        <img id="profile-photo" src="" alt="Foto de perfil" width="96" height="96">
        <p id="profile-name"></p>
        <dl>
          <dt>Correo</dt>
          <dd id="profile-email"></dd>
          <dt>Teléfono</dt>
          <dd id="profile-phone"></dd>
          <dt>Edad</dt>
          <dd id="profile-age"></dd>
        </dl>
      </section>

      <section id="todos-section">
        <h2>Mis tareas</h2>

        <ul id="stats">
          <li>Total: <span id="stat-total">0</span></li>
          <li>Completadas: <span id="stat-completed">0</span></li>
          <li>Pendientes: <span id="stat-pending">0</span></li>
          <li>Avance: <span id="stat-percent">0</span>%</li>
        </ul>

        <form id="add-form">
          <label for="new-todo">Nueva tarea</label>
          <input id="new-todo" name="new-todo" type="text" required>
          <button id="add-button" type="submit">Agregar</button>
        </form>

        <label for="filter">Mostrar</label>
        <select id="filter">
          <option value="all">Todas</option>
          <option value="pending">Pendientes</option>
          <option value="completed">Completadas</option>
        </select>

        <label for="search">Buscar</label>
        <input id="search" type="search">

        <p id="todos-message" hidden></p>
        <ul id="todo-list"></ul>
      </section>
    </section>
  </main>
</body>
</html>
